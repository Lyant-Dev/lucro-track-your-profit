<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucro</title>
    <!-- ======== STYLE =========  -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Lucro</h1>
    <h2>Track Your Profit</h2>

    <!-- ======== INPUT AREA ======== -->
    <!-- ========= FORM  ========== -->
    <div class="form-container" id="form-container">
      <div class="transaction-radio">
        <h3>Tipe Transaksi:</h3>
        <input
          type="radio"
          id="expense-radio"
          name="transaction-radio"
          value="expense"
        />
        <label for="expense-radio">Pengeluaran</label><br />
        <input
          type="radio"
          id="income-radio"
          name="transaction-radio"
          value="income"
        />
        <label for="income-radio">Pemasukan</label><br />
      </div>
      <form action="" class="form-data" id="form-data">
        <label for="item-name">Item: </label>
        <input
          type="text"
          class="item-name"
          id="item-name"
          name="item-name"
          placeholder="Nama item"
        />
        <label for="amount">Nominal: </label>
        <input
          type="number"
          class="amount"
          id="amount"
          name="amount"
          placeholder="Nominal"
        />
        <label for="src">Sumber Pemasukan: </label>
        <select name="src" class="src" id="src">
          <option value="online">Online</option>
          <option value="offline">Offline</option>
        </select>
        <label for="expense-type">Tipe Pengeluaran</label>
        <select name="expense-type" id="expense-type">
          <option value="modal">Modal</option>
          <option value="operasional">Operasional</option>
          <option value="gaji">Gaji</option>
          <option value="lain-lain">Lain-lain</option>
        </select>
        <br />
        <label for="date">Tanggal: </label>
        <input type="date" class="date" id="date" />
        <label for="note">Catatan: </label>
        <textarea
          name="note"
          id="note"
          placeholder="Catatan"
          cols="30"
          rows="6"
        ></textarea>
        <input type="submit" value="Simpan Transaksi" />
      </form>
    </div>

    <!-- ========== DISPLAY AREA ========== -->
    <!-- =========== SUMMARY SECTION ========= -->
    <div class="summary-container" id="summary-container">
      <h3>Rangkuman Transaksi:</h3>
      <p id="transaction-summary"></p>
    </div>
    <!-- ========= HISTORY SECTION ======== -->
    <div class="history-container" id="history-container">
      <h3>Riwayat Transaksi:</h3>
      <ul id="history-summary "></ul>
    </div>

    <!-- ========== APP ========== -->
    <script src="app.js"></script>
  </body>
</html>
